<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Réponse du service client</title>
</head>
<body style="font-family: Arial, sans-serif; color: #1f2937; line-height: 1.6; max-width: 600px; margin: 0 auto; padding: 24px;">
    <h2 style="color: #111827;">Bonjour <span th:text="${firstName}">Client</span>,</h2>
    <p>Un conseiller a répondu à votre demande SAV <strong th:text="'#' + ${ticketId}">#42</strong>
        <span th:if="${ticketSubject != null and !#strings.isEmpty(ticketSubject)}">
            concernant « <em th:text="${ticketSubject}">Sujet</em> »
        </span>.
    </p>
    <p>Connectez-vous à votre espace client pour consulter sa réponse et poursuivre l'échange.</p>
    <hr style="border: none; border-top: 1px solid #e5e7eb; margin: 24px 0;">
    <p style="font-size: 12px; color: #6b7280;">Service Client E-Commerce</p>
</body>
</html>
