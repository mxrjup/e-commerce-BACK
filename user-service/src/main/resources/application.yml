server:
  port: 8082

spring:
  application:
    name: users-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ecommerce_users}}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: false
    open-in-view: false

  security:
    oauth2:
      resourceserver:
        jwt:
          # Comme la gateway : l'issuer est l'URL frontale de Keycloak, celle
          # que contient le jeton ; les cles se recuperent sur l'URL joignable
          # depuis le reseau du service.
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/ecommerce}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/ecommerce/protocol/openid-connect/certs}

keycloak:
  admin:
    # URL de Keycloak joignable depuis le service (dans Docker : keycloak:8080),
    # sans /realms. Elle peut differer de l'issuer que voient les navigateurs.
    server-url: ${KEYCLOAK_ADMIN_SERVER_URL:http://localhost:8180}
    realm: ${KEYCLOAK_REALM:ecommerce}
    # Client confidentiel a compte de service du realm (voir le README,
    # « Collaborateurs »). Le defaut « set-me » est celui du realm importe en
    # local ; deploye, le secret vient toujours d'un Secret, jamais d'un fichier.
    client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:user-service}
    client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:set-me}

---
spring:
  config:
    activate:
      on-profile: local-h2

  datasource:
    url: jdbc:h2:mem:usersdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
