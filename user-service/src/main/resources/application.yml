server:
  port: 8082

spring:
  application:
    name: user-service

keycloak:
  admin:
    # URL de Keycloak joignable depuis le service (dans Docker : keycloak:8080),
    # sans /realms. Elle peut differer de l'issuer que voient les navigateurs.
    server-url: ${KEYCLOAK_ADMIN_SERVER_URL:http://localhost:8180}
    realm: ${KEYCLOAK_REALM:ecommerce}
    # Client confidentiel a compte de service du realm (voir le README,
    # « Collaborateurs »). Le defaut « set-me » est celui du realm importe en
    # local ; deploye, le secret vient toujours d'un Secret, jamais d'un fichier.
    client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:user-service}
    client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:set-me}
