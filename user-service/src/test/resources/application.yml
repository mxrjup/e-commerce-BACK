spring:
  application:
    name: users-service

  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

# Les appels a Keycloak sont interceptes par le MockRestServiceServer des
# tests : cette URL n'est jamais contactee.
keycloak:
  admin:
    server-url: http://keycloak.test
    realm: ecommerce
    client-id: user-service
    client-secret: test-secret
