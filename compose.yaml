# Stack de developpement local : Postgres, Keycloak, Kafka, et les services
# applicatifs derriere le profil « services ».
#
#   docker compose up -d                      # les dependances seules
#   docker compose --profile services up -d   # + les services applicatifs
#   docker compose down                       # arret (les volumes sont gardes)
#   docker compose down -v                    # arret + remise a zero des donnees
#
# Ce fichier ne sert QUE en local. Les environnements deployes passent par les
# manifests Kubernetes (D04 #88) et des Secrets : les identifiants ci-dessous
# sont des valeurs de developpement, surchargeables par un fichier .env local
# (voir .env.example).
name: ecommerce

services:
  postgres:
    image: postgres:16-alpine
    container_name: ecommerce-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Cree une base par service au premier demarrage, sur un volume vide.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: ecommerce-keycloak
    # start-dev : HTTP en clair et pas de cache distribue. Jamais en deploye.
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:-postgres}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_ENABLED: "true"
    ports:
      - "${KEYCLOAK_PORT:-8180}:8080"
    volumes:
      # T03 (#83) depose ici l'export JSON du realm, importe au demarrage.
      - ./docker/keycloak/import:/opt/keycloak/data/import:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # L'image Keycloak ne contient ni curl ni wget : on interroge le port de
      # management (9000) avec le /dev/tcp de bash.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: 127.0.0.1\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.8.1
    container_name: ecommerce-kafka
    environment:
      # KRaft, un seul noeud qui cumule les roles broker et controller.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      CLUSTER_ID: ecommerce-local-kraft-01
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # INTERNAL : depuis le reseau Docker. EXTERNAL : depuis la machine hote,
      # pour lancer un service dans l'IDE en gardant Kafka dans Docker.
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # K01 (#85) cree les topics explicitement et passera ceci a false.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - "${KAFKA_PORT:-29092}:29092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 15s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Services applicatifs. Profil « services » : ils ne demarrent pas avec un
  # simple `docker compose up`, et attendent les Dockerfiles de D01 (#87).
  # Un nouveau service se branche ici sur le meme modele, avec sa base dediee
  # (voir docker/postgres/init/01-databases.sql) et son port du README.
  # ---------------------------------------------------------------------------
  cart-service:
    profiles: ["services"]
    build:
      context: .
      dockerfile: cart-service/Dockerfile
    container_name: ecommerce-cart-service
    environment:
      SERVER_PORT: 8083
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${CART_DB_NAME:-ecommerce_cart}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  kafka-data:
