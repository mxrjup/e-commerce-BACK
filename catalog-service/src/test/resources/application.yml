spring:
  application:
    name: catalog-service

  datasource:
    url: jdbc:h2:mem:catalogtest;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  # Les tests passent par les vraies migrations, et Hibernate verifie que les
  # entites leur correspondent : un ecart entre les deux fait echouer le build.
  flyway:
    enabled: true

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  # Pas de broker pour les tests H2 : le consommateur de order.paid (C21) ne
  # demarre pas. Les tests Kafka sur un vrai broker le reactivent.
  kafka:
    listener:
      auto-startup: false
