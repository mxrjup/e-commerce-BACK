server:
  port: 8087

spring:
  application:
    name: mcp-service
  ai:
    mcp:
      server:
        name: ecommerce-mcp
        version: 0.0.1
        type: SYNC
        protocol: STREAMABLE
        stdio: false
        capabilities:
          tool: true
          resource: false
          prompt: false
          completion: false
        streamable-http:
          mcp-endpoint: /api/mcp
          keep-alive-interval: 30s

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
