server:
  port: 8087

spring:
  application:
    name: mcp-service

  ai:
    mcp:
      server:
        name: ecommerce-mcp
        version: 0.0.1
        type: SYNC
        protocol: STREAMABLE
        stdio: false
        capabilities:
          tool: true
          resource: false
          prompt: false
          completion: false
        streamable-http:
          mcp-endpoint: /mcp
          keep-alive-interval: 30s

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ecommerce_mcp}}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  # Flyway cree et fait evoluer le schema (src/main/resources/db/migration) ;
  # Hibernate se contente de verifier que les entites y correspondent.
  flyway:
    enabled: true

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: false
    open-in-view: false

# Chemins du transport MCP proteges par un jeton MCP (M03). Les defauts
# couvrent SSE et Streamable HTTP du serveur Spring AI (M01) : voir
# McpSecurityProperties.
mcp:
  security:
    protected-paths: /sse,/mcp,/mcp/*

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

---
spring:
  config:
    activate:
      on-profile: local-h2

  # Mode PostgreSQL : les memes migrations tournent sur H2 et sur PostgreSQL.
  datasource:
    url: jdbc:h2:mem:mcpdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    show-sql: true
