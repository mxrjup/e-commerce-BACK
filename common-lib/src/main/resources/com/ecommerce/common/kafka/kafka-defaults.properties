# Defaults Kafka communs a tous les services, ajoutes par
# KafkaDefaultsEnvironmentPostProcessor avec la priorite la plus basse :
# l'application.yml d'un service, une variable d'environnement ou une
# propriete de test les remplacent.

# Depuis l'IDE. Dans Docker et Kubernetes, SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092.
spring.kafka.bootstrap-servers=localhost:29092

# --- Production : evenements serialises en JSON, type dans les en-tetes ---
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all

# --- Consommation ---
# Un groupe par service : chaque service recoit tous les evenements d'un topic.
spring.kafka.consumer.group-id=${spring.application.name}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# ErrorHandlingDeserializer : un message illisible part dans le DLT au lieu
# d'etre relu en boucle et de bloquer la partition.
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
# Seuls les evenements partages de common-lib sont deserialises : jamais "*",
# qui laisserait un message choisir la classe a instancier.
spring.kafka.consumer.properties.spring.json.trusted.packages=com.ecommerce.common.event

# --- Topics (voir KafkaTopics et docker/kafka/create-topics.sh) ---
app.kafka.topics.order-paid=order.paid
app.kafka.topics.catalog-events=catalogue.evenements
app.kafka.topics.support-admin-reply=sav.reponse-admin
