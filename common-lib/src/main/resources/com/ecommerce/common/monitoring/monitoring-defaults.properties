# Supervision commune a tous les services (D06), ajoutee par
# MonitoringDefaultsEnvironmentPostProcessor avec la priorite la plus basse :
# l'application.yml d'un service, une variable d'environnement ou une
# propriete de test les remplacent.

# /actuator/prometheus est lu par Prometheus toutes les 15 s. Il reste interne :
# l'Ingress n'ouvre que /api et /auth, et la gateway ne route jamais /actuator.
management.endpoints.web.exposure.include=health,info,prometheus
# /actuator/health/liveness et /readiness, pour les sondes Kubernetes.
management.endpoint.health.probes.enabled=true

# Chaque mesure porte le nom de son service : un seul dashboard pour les huit.
management.metrics.tags.application=${spring.application.name}

# Les temps de reponse HTTP en histogramme, pour calculer le 95e percentile
# dans Prometheus (histogram_quantile), tous services et instances confondus.
# Bornes de 5 ms a 10 s : une soixantaine de seaux par route, pas plus.
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.minimum-expected-value.http.server.requests=5ms
management.metrics.distribution.maximum-expected-value.http.server.requests=10s

# Meme chose pour les requetes relayees par la gateway, mesurees par route
# (routeId) par Spring Cloud Gateway. Sans effet dans les autres services.
management.metrics.distribution.percentiles-histogram.spring.cloud.gateway.requests=true
management.metrics.distribution.minimum-expected-value.spring.cloud.gateway.requests=5ms
management.metrics.distribution.maximum-expected-value.spring.cloud.gateway.requests=10s
