server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      # Un service = une route. Les chemins /api/admin/** sont reserves au
      # back-office par SecurityConfig, quel que soit le service cible.
      routes:
        - id: cart
          uri: ${CART_SERVICE_URI:http://localhost:8083}
          predicates:
            - Path=/api/cart/**
        - id: catalog
          uri: ${CATALOG_SERVICE_URI:http://localhost:8081}
          predicates:
            - Path=/api/catalog/**
        - id: catalog-admin
          uri: ${CATALOG_SERVICE_URI:http://localhost:8081}
          predicates:
            - Path=/api/admin/catalog/**
        - id: users-admin
          uri: ${USER_SERVICE_URI:http://localhost:8082}
          predicates:
            - Path=/api/admin/users/**
        - id: orders
          uri: ${ORDER_SERVICE_URI:http://localhost:8084}
          predicates:
            - Path=/api/orders/**
        - id: orders-admin
          uri: ${ORDER_SERVICE_URI:http://localhost:8084}
          predicates:
            - Path=/api/admin/orders/**
        - id: user-service-users
          uri: ${USER_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/users/**
        - id: user-service-addresses
          uri: ${USER_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/addresses/**
        - id: mcp-admin
          uri: ${MCP_SERVICE_URI:http://localhost:8087}
          predicates:
            - Path=/api/admin/mcp/**
        # Transport MCP (M01) : authentifie par un jeton MCP, verifie par
        # mcp-service et non par la gateway (voir SecurityConfig). Pas de
        # delai de reponse : un flux SSE reste ouvert tant que le client vit.
        - id: mcp
          uri: ${MCP_SERVICE_URI:http://localhost:8087}
          predicates:
            - Path=/mcp,/mcp/**,/sse
          metadata:
            response-timeout: -1
        - id: user-service-store-settings
          uri: ${USER_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/store-settings/**
        - id: user-service-admin-store-settings
          uri: ${USER_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/admin/store-settings/**
      httpclient:
        connect-timeout: 2000
        response-timeout: 10s

  security:
    oauth2:
      resourceserver:
        jwt:
          # L'issuer est l'URL frontale de Keycloak : c'est ce que contient le
          # jeton. Les cles, elles, se recuperent sur l'URL joignable depuis
          # le reseau du service ; les deux peuvent donc differer.
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/ecommerce}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/ecommerce/protocol/openid-connect/certs}
          # Audience ajoutee par les clients web-bo et mobile-app (T03) : un
          # jeton emis pour une autre audience est refuse.
          audiences: ecommerce-api

gateway:
  cors:
    # Back-office Vite et serveur de developpement Expo.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    org.springframework.cloud.gateway: INFO
